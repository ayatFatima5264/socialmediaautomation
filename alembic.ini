# ---------------------------------------------------------------------------
# Alembic configuration.
#
# There is deliberately NO sqlalchemy.url here. The URL comes from
# app.config.settings.database_url in migrations/env.py, so migrations can
# never run against a different database than the application — and so no
# connection string with a password ends up committed.
#
#   venv/Scripts/alembic revision --autogenerate -m "add x"
#   venv/Scripts/alembic upgrade head
#   venv/Scripts/alembic downgrade -1
#
# In production nobody runs these by hand: app.database.run_migrations() calls
# `upgrade head` on startup.
# ---------------------------------------------------------------------------
[alembic]
script_location = migrations
prepend_sys_path = .
# Revision files are named 0001_slug.py, 0002_slug.py — ordered on disk in the
# order they apply, which a bare hash is not.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
